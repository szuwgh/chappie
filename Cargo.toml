cargo-features = ["profile-rustflags"]

[package]
name = "chappie"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "chap"
path = "src/main.rs" 

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html


[target.x86_64-unknown-linux-musl]
linker = "x86_64-linux-musl-gcc"

[profile.release]
opt-level = 3
debug = "none"
strip = "symbols"
debug-assertions = false
overflow-checks = false
lto = "fat"
panic = "abort"
incremental = false
codegen-units = 1

rustflags = [
    "-C", "target-feature=+avx,+avx2,+fma,+f16c",
    "-C", "target-cpu=native"
]

#[workspace]
#members = [
#  "crates/llmapi_macro", 
#  "crates/llmapi",
#]

[dependencies]
clap = { version ="4.4.6",features = ["derive", "env"]}        
crossterm = "0.28.1"
memmap2 = "0.9.0"
ratatui = "0.29.0"
unicode-width = "0.1"
thiserror = "1.0.60"
once_cell = "1.20.1"
simplelog = "0.12.2"
log = "0.4"
atty = "0.2.14"
utf8_iter = "=1.0.2"
const-hex = "1.14.0"
half = "2.6.0"
hex = "0.4.3"
color-eyre = "0.6.5"
dirs = "5.0"
mlua = { version = "0.10", features = ["lua54", "vendored", "error-send"] }
crc = "3.0"
byteorder = "1"
tempfile = "3"

[dev-dependencies]
tempfile = "3"

